[system]
language=korean

[font]
# Use the Windows GDI renderer derived from the legacy Korean fallout2font.dll.
gdi_renderer=1
ttf_renderer=0
legacy_codepage=949

# Korean Text Engine preset: Dotum 11 body, Cafe24 Ohsquare air Light 16 bold buttons/titles.
gdi_text_face=Dotum
gdi_text_size=11
gdi_text_weight=400
gdi_text_line_height=11
gdi_button_face=Cafe24 Ohsquare air Light
gdi_button_size=16
gdi_button_weight=700
gdi_button_line_height=20

# Font 104 is used for title/main-menu text.
gdi_title_face=Cafe24 Ohsquare air Light
gdi_title_size=16
gdi_title_weight=700
gdi_title_line_height=20

# Midpoint threshold removes the antialias fringe that made small glyphs too thick.
gdi_binary_threshold=128
baseline_offset=0
